[project]
name = "kamokamo"
version = "0.1.0"
description = "Rust-like Option, Result, and iterators for typed Python"
readme = "README.md"
requires-python = ">=3.14"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "samhain", email = "samhain@moonwit.ch" }]
keywords = ["functional-programming", "option", "result", "iterators", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Documentation = "https://kamokamo.readthedocs.io/en/latest/"
Source = "https://github.com/the-moonwitch/kamokamo"
Issues = "https://github.com/the-moonwitch/kamokamo/issues"
Changelog = "https://github.com/the-moonwitch/kamokamo/releases"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["examples/**"]

[tool.ruff]
target-version = "py314"
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests", "examples"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["kamokamo"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    { include-group = "test" },
    "basedpyright>=1.40.2",
    "mypy>=2.4.0",
    "pyinstrument>=5.1.3",
    "pyperf>=2.10.0",
    "pyright[nodejs]>=1.1.414",
    "ruff>=0.16.10",
]
docs = [
    "alabaster>=1.0.0",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
]
test = [
    "hypothesis>=6.168.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
